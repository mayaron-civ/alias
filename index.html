<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0812">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alias">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Alias имени Луговской Дарьи Шуровны</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0812;
  --card:rgba(255,255,255,.055);
  --card2:rgba(255,255,255,.1);
  --stroke:rgba(255,255,255,.11);
  --stroke2:rgba(255,255,255,.22);
  --text:#f4f0fb; --muted:#a79dc2; --muted2:#7b7194;
  --a1:#a855f7; --a2:#ec4899; --a3:#f59e0b; --a4:#38bdf8;
  --ok:#34d399; --bad:#fb7185;
  --l1:#34d399; --l2:#38bdf8; --l3:#a855f7; --l4:#f59e0b;
  --r:20px;
  --h:"Unbounded",system-ui,sans-serif;
  --b:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --e:cubic-bezier(.22,.9,.28,1);
  --e2:cubic-bezier(.3,1.25,.5,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;overflow-x:clip;overscroll-behavior-x:none}
body{
  margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);
  font-family:var(--b);font-size:16px;line-height:1.45;
  overflow-x:hidden;overflow-x:clip;overscroll-behavior:none;touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(52% 46% at 18% 10%, rgba(168,85,247,.40), transparent 72%),
    radial-gradient(48% 44% at 84% 16%, rgba(236,72,153,.32), transparent 72%),
    radial-gradient(54% 50% at 50% 94%, rgba(56,189,248,.20), transparent 74%),
    radial-gradient(44% 40% at 90% 78%, rgba(245,158,11,.19), transparent 72%);
  animation:drift 28s ease-in-out infinite alternate}
/* на телефоне фон не шевелим: лишний кадр анимации мешает свайпу */
@media (max-width:759px){ body::before{animation:none} }
@keyframes drift{0%{transform:scale(1)}50%{transform:translate3d(-3%,2%,0) scale(1.08)}100%{transform:translate3d(3%,-2%,0) scale(1.03)}}
/* при системном «меньше анимации» убираем крупные движения, но оставляем мелкие переходы */
@media (prefers-reduced-motion:reduce){
  body::before{animation:none}
  .screen,#stage>*,.ritem,.brow,.tally,.winner,.ready .who,.sheet,.modal,
  .wordcard .w,.wordcard .tag{animation-duration:.01ms!important;animation-delay:0ms!important}
}

.wrap{max-width:820px;margin:0 auto;min-height:100vh;min-height:100dvh;
  padding:14px 14px calc(22px + var(--safe-b))}
.screen{display:none;animation:in .38s var(--e)}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--h);margin:0;letter-spacing:-.025em;line-height:1.08}

/* ============ ГЛАВНАЯ ============ */
.hero{text-align:center;padding:30px 0 4px}
.logo{font-family:var(--h);font-weight:900;font-size:clamp(50px,16vw,92px);line-height:.9;margin:0;
  background:linear-gradient(104deg,#fff,var(--a1) 36%,var(--a2) 62%,var(--a3) 94%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 26px rgba(168,85,247,.38))}
.byline{font-size:clamp(12.5px,3.7vw,17px);font-weight:600;color:var(--muted);margin-top:12px}

.modes{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.mode{position:relative;overflow:hidden;cursor:pointer;color:inherit;font:inherit;text-align:left;
  display:flex;align-items:center;gap:14px;width:100%;
  background:var(--card);border:1px solid var(--stroke);border-radius:var(--r);padding:20px 18px 20px 20px;
  transition:transform .26s var(--e),border-color .26s,background .26s,box-shadow .26s}
.mode::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--c1),var(--c2))}
.mode:active{transform:scale(.975)}
.mode:hover{background:var(--card2);border-color:var(--stroke2);transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.mode .arr{transition:transform .26s var(--e)}
.mode:hover .arr{transform:translateX(4px)}
.mode b{flex:1;min-width:0;font-family:var(--h);font-size:19px;font-weight:700;letter-spacing:-.02em}
.mode .arr{color:var(--muted2);font-size:20px;flex:none}

/* ============ ОБЩЕЕ ============ */
.card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r);padding:16px;margin-bottom:11px}
.card h3{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin-bottom:13px}

.top{display:flex;align-items:center;gap:10px;margin-bottom:16px;min-height:44px}
.top h2{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{background:var(--card);border:1px solid var(--stroke);color:var(--text);border-radius:13px;
  min-width:44px;height:44px;padding:0 12px;display:grid;place-items:center;cursor:pointer;
  font-family:var(--b);font-size:15px;font-weight:700;flex:none}
.iconbtn{transition:transform .16s var(--e2),background .22s,border-color .22s}
.iconbtn:active{background:var(--card2);transform:scale(.92)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%;
  border:1px solid var(--stroke);background:var(--card);color:var(--text);
  font-family:var(--b);font-size:16px;font-weight:700;padding:15px 18px;border-radius:15px;
  transition:transform .16s var(--e2),background .22s,border-color .22s,box-shadow .22s,opacity .22s}
.btn:active{transform:scale(.965)}
.btn:hover{background:var(--card2)}
.btn.primary{border:none;color:#150526;font-weight:800;
  background:linear-gradient(100deg,var(--a3),var(--a2) 46%,var(--a1));
  box-shadow:0 10px 30px rgba(168,85,247,.3)}
.btn.big{padding:19px;font-size:18px;border-radius:17px}
.btn.ok{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.4);color:#8af0cc}
.btn.bad{background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.36);color:#ffb0bc}
.btn.ghost{background:transparent;color:var(--muted)}
.btn[disabled]{opacity:.35;pointer-events:none}
.row{display:flex;gap:9px}
.row>*{flex:1}
.sp{height:9px}

/* уровни */
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{cursor:pointer;user-select:none;border:1px solid var(--stroke);background:var(--card);
  border-radius:999px;padding:11px 17px;font-size:14px;font-weight:700;color:var(--muted);
  transition:background .26s var(--e),color .22s,border-color .22s,transform .16s var(--e2)}
.pill:active{transform:scale(.94)}
.pill.sel{color:#0e0a16;border-color:transparent}
.pill.l1.sel{background:linear-gradient(100deg,#34d399,#22d3a8)}
.pill.l2.sel{background:linear-gradient(100deg,#38bdf8,#60a5fa)}
.pill.l3.sel{background:linear-gradient(100deg,#a855f7,#d946ef)}
.pill.l4.sel{background:linear-gradient(100deg,#f59e0b,#ef4444);color:#fff}

.themegrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.theme{cursor:pointer;user-select:none;display:flex;flex-direction:column;gap:3px;
  border:1px solid var(--stroke);background:var(--card);border-radius:13px;padding:12px 13px;
  transition:background .26s var(--e),border-color .22s,transform .16s var(--e2)}
.theme:active{transform:scale(.97)}
.theme .n{font-size:14px;font-weight:700;line-height:1.15}
.theme .c{font-size:11px;color:var(--muted2);font-weight:600}
.theme.sel{background:linear-gradient(100deg,rgba(168,85,247,.26),rgba(56,189,248,.14));border-color:rgba(168,85,247,.55)}

/* команды */
.team{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dot{width:13px;height:13px;border-radius:50%;flex:none;box-shadow:0 0 0 4px rgba(255,255,255,.055)}
.team input{flex:1;min-width:0;background:rgba(0,0,0,.3);border:1px solid var(--stroke);color:var(--text);
  border-radius:12px;padding:13px;font:inherit;font-size:16px;font-weight:700}
.team input:focus{outline:none;border-color:rgba(168,85,247,.6)}
.team .rm{background:none;border:none;color:var(--muted2);cursor:pointer;font-size:22px;padding:6px 8px;flex:none}

.field{margin-bottom:17px}
.field label{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:10px}
.field label b{color:var(--text);font-family:var(--h);font-size:15px;font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:rgba(255,255,255,.14);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;cursor:pointer;
  background:linear-gradient(140deg,var(--a3),var(--a2),var(--a1));box-shadow:0 3px 12px rgba(0,0,0,.55)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:none;border-radius:50%;
  background:linear-gradient(140deg,var(--a3),var(--a2),var(--a1))}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;cursor:pointer;
  border-top:1px solid rgba(255,255,255,.055)}
.switch span{font-size:15px;font-weight:600}
.tog{width:50px;height:30px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;flex:none;
  transition:background .3s var(--e)}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;
  transition:transform .3s var(--e2)}
.switch.on .tog{background:linear-gradient(100deg,var(--a1),var(--a2))}
.switch.on .tog::after{transform:translateX(20px)}

/* ============ ГОТОВНОСТЬ ============ */
#s-ready.on{display:flex;flex-direction:column;
  min-height:calc(100vh - 36px - var(--safe-b));min-height:calc(100dvh - 36px - var(--safe-b))}
.ready{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.ring{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;margin-bottom:22px;
  font-family:var(--h);font-size:32px;font-weight:900;background:var(--card);border:1px solid var(--stroke)}
.ready .who{font-family:var(--h);font-size:clamp(28px,8.5vw,50px);font-weight:900;line-height:1.05;
  animation:rise .5s var(--e2) backwards .06s}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
.kicker{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted2);font-weight:700}
.chip{margin-top:16px;display:inline-block;background:var(--card);border:1px solid var(--stroke);
  border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;color:var(--muted)}

/* ============ ИГРА ============ */
#s-play.on{display:flex;flex-direction:column;
  min-height:calc(100vh - 36px - var(--safe-b));min-height:calc(100dvh - 36px - var(--safe-b))}
.playhead{display:flex;align-items:center;gap:11px;margin-bottom:12px;flex:none}
.quit{background:var(--card);border:1px solid var(--stroke);color:var(--muted);border-radius:12px;
  width:40px;height:40px;display:grid;place-items:center;cursor:pointer;font-size:17px;flex:none}
.quit:active{background:var(--card2)}
.timerbox{position:relative;width:56px;height:56px;flex:none}
.timerbox svg{transform:rotate(-90deg);display:block}
.timerbox .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--h);font-size:18px;
  font-weight:800;transition:color .3s}
#tarc{transition:stroke-dashoffset 1s linear}
#tarc.jump{transition:none}
.playhead .meta{flex:1;min-width:0}
.playhead .tn{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.playhead .sc{font-size:12px;color:var(--muted2);font-weight:600}
.scorenow{font-family:var(--h);font-size:28px;font-weight:900;flex:none;
  transition:transform .26s var(--e2),color .3s}
.scorenow.bump{transform:scale(1.28)}

/* карточка, улетающая вправо, иначе делает страницу прокручиваемой вбок
   (влево — нет, поэтому лагало только в одну сторону).
   hidden — запасной вариант для браузеров без overflow:clip */
#stage{flex:1;display:flex;min-height:0;position:relative;
  overflow:hidden;overflow:clip;overflow-clip-margin:80px}
#stage>*{flex:1;min-width:0}

.wordcard,.phrase,.photowrap{position:relative;border-radius:26px;overflow:hidden;
  border:1px solid var(--stroke2);box-shadow:0 18px 50px rgba(0,0,0,.5);
  background:linear-gradient(155deg,rgba(255,255,255,.1),rgba(255,255,255,.035))}
.swipe{touch-action:pan-y;user-select:none;will-change:transform;backface-visibility:hidden}
.swipe.snap{transition:transform .34s var(--e)}
#stage>*{animation:cardIn .42s var(--e2)}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.955)}to{opacity:1;transform:none}}
.wordcard .w,.wordcard .tag{animation:soft .5s var(--e) backwards .08s}
@keyframes soft{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.wordcard{display:grid;place-items:center;padding:26px 20px;text-align:center}
.wordcard::before{content:"";position:absolute;inset:0;opacity:.6;pointer-events:none;
  background:radial-gradient(78% 62% at 50% 0%,var(--lvl,rgba(168,85,247,.32)),transparent 72%)}
.wordcard .w{position:relative;font-family:var(--h);font-weight:900;line-height:1.07;letter-spacing:-.03em;
  font-size:clamp(28px,8.6vw,58px);overflow-wrap:break-word;hyphens:auto}
.wordcard .w.m{font-size:clamp(24px,6.6vw,46px)}
.wordcard .w.s{font-size:clamp(19px,5vw,34px);letter-spacing:-.02em}
.wordcard .tag{position:relative;margin-top:15px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  font-weight:800;color:var(--lvlc,var(--muted2))}
.tint{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .22s var(--e)}
.sw-ok .tint.g{opacity:1;background:linear-gradient(105deg,rgba(52,211,153,.34),rgba(52,211,153,.06))}
.sw-bad .tint.r{opacity:1;background:linear-gradient(255deg,rgba(251,113,133,.34),rgba(251,113,133,.06))}
.verdict{position:absolute;top:18px;font-family:var(--h);font-weight:900;font-size:24px;letter-spacing:.06em;
  opacity:0;transition:opacity .2s var(--e),transform .3s var(--e2);pointer-events:none;
  border:3px solid currentColor;border-radius:11px;padding:3px 12px}
.verdict.g{left:18px;color:var(--ok);transform:rotate(-11deg) scale(.82)}
.verdict.r{right:18px;color:var(--bad);transform:rotate(11deg) scale(.82)}
.sw-ok .verdict.g{opacity:1;transform:rotate(-11deg) scale(1)}
.sw-bad .verdict.r{opacity:1;transform:rotate(11deg) scale(1)}

.photowrap{background:#07060c;display:flex}
.photowrap img{width:100%;height:100%;object-fit:contain;display:block;
  -webkit-user-drag:none;user-select:none;pointer-events:none}
.veil{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;cursor:pointer;
  background:#0b0716;transition:opacity .3s}
.veil.hide{opacity:0;pointer-events:none}
.veil b{font-family:var(--h);font-size:17px;font-weight:700;color:var(--muted)}
.veil i{display:block;margin-top:8px;font-style:normal;font-size:13px;color:var(--muted2)}

.phrase{display:flex;flex-direction:column;justify-content:center;padding:26px 20px}
.phrase .q{font-family:var(--h);font-weight:700;font-size:clamp(19px,5.4vw,30px);line-height:1.3;letter-spacing:-.02em}
.phrase .q::before{content:"«"}.phrase .q::after{content:"»"}
.phrase .answer{margin-top:20px;padding-top:16px;border-top:1px dashed var(--stroke2);
  display:flex;align-items:center;gap:11px;opacity:0;transform:translateY(6px);transition:.3s}
.phrase .answer.show{opacity:1;transform:none}
.phrase .av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-family:var(--h);font-weight:900;font-size:17px;color:#180a24}
.phrase .nm{font-family:var(--h);font-size:20px;font-weight:800}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px;flex:none}
.opt{cursor:pointer;border:1px solid var(--stroke);background:var(--card);border-radius:14px;padding:16px 10px;
  font:inherit;font-size:15px;font-weight:700;color:var(--text);text-align:center}
.opt:disabled{cursor:default}
.opt.right{background:rgba(52,211,153,.2);border-color:var(--ok);color:#9ff5d3}
.opt.wrong{background:rgba(251,113,133,.16);border-color:var(--bad);color:#ffb3bf}
.opt.dim{opacity:.32}

.cardhint{position:absolute;right:14px;bottom:14px;z-index:3;width:38px;height:38px;border-radius:50%;
  border:1px solid var(--stroke2);background:rgba(12,7,24,.72);color:var(--muted);
  font-family:var(--h);font-size:16px;font-weight:800;cursor:pointer;display:grid;place-items:center;
  transition:transform .18s var(--e2),color .22s,background .22s}
.cardhint:hover{color:var(--text);background:rgba(0,0,0,.5)}
.cardhint:active{transform:scale(.88)}
.under{flex:none;text-align:center;margin-top:10px}
.reroll{background:none;border:none;color:var(--muted2);font:inherit;font-size:14px;font-weight:600;
  cursor:pointer;padding:10px 16px}
.actions{display:grid;grid-template-columns:1fr 1.45fr;gap:9px;margin-top:11px;flex:none}
.actions .btn{padding:21px 10px;font-size:17px;border-radius:17px}
.hint{text-align:center;font-size:12px;color:var(--muted2);margin-top:11px;flex:none;font-weight:600}
.hint .g{color:var(--ok)}.hint .r{color:var(--bad)}
.kbd{display:inline-block;border:1px solid var(--stroke);border-bottom-width:2px;border-radius:5px;
  padding:0 5px;font-family:ui-monospace,monospace;font-size:11px}

/* ============ ИТОГ ============ */
.tally{display:flex;justify-content:center;align-items:baseline;gap:8px;margin:2px 0 18px;
  animation:rise .55s var(--e2)}
.tally .n{font-family:var(--h);font-size:56px;font-weight:900;
  background:linear-gradient(120deg,var(--a3),var(--a2),var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
.tally .l{color:var(--muted);font-size:14px;font-weight:600}
.rlist{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.ritem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--stroke);
  border-radius:14px;padding:10px 12px;animation:rin .42s var(--e) backwards;
  transition:background .22s,border-color .22s}
.ritem:hover{border-color:var(--stroke2)}
@keyframes rin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ritem .mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;
  font-weight:800;flex:none;cursor:pointer}
.ritem.y .mark{background:rgba(52,211,153,.2);color:var(--ok)}
.ritem.n .mark{background:rgba(251,113,133,.17);color:var(--bad)}
.ritem .txt{flex:1;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;cursor:pointer}
.ritem.n .txt{color:var(--muted2);text-decoration:line-through}
.ritem img{width:46px;height:36px;object-fit:cover;border-radius:8px;flex:none}
.ask{width:30px;height:30px;border-radius:50%;flex:none;cursor:pointer;
  border:1px solid var(--stroke);background:transparent;color:var(--muted2);
  font-family:var(--h);font-size:14px;font-weight:800;
  transition:transform .18s var(--e2),color .22s,border-color .22s}
.ask:active{transform:scale(.86)}
.ask:hover{color:var(--text);border-color:var(--stroke2)}
.empty{text-align:center;color:var(--muted2);font-size:14px;padding:18px 0}

/* ============ ТАБЛО ============ */
.board{display:flex;flex-direction:column;gap:8px}
.brow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--stroke);
  border-radius:16px;padding:15px 16px;position:relative;overflow:hidden;
  animation:rin .45s var(--e) backwards}
.brow.lead{border-color:rgba(245,158,11,.5);background:linear-gradient(100deg,rgba(245,158,11,.14),rgba(236,72,153,.07))}
.brow .pos{font-family:var(--h);font-size:14px;font-weight:900;color:var(--muted2);width:18px;flex:none}
.brow .nm{flex:1;min-width:0;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .pts{font-family:var(--h);font-size:25px;font-weight:900;flex:none}
.brow .bar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .6s}
.winner{text-align:center;padding:22px 0;animation:rise .6s var(--e2)}
.winner .nm{font-family:var(--h);font-size:clamp(30px,10vw,54px);font-weight:900;margin:10px 0 6px;
  background:linear-gradient(105deg,var(--a3),var(--a2),var(--a1));-webkit-background-clip:text;background-clip:text;color:transparent}
.winner .s{color:var(--muted);font-size:14px}
.err{background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.4);border-radius:14px;
  padding:14px;font-size:13.5px;color:#ffc2cb;margin-bottom:11px}

/* ============ ОКНО СО СПРАВКОЙ ============ */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(5,3,10,.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  animation:fade .24s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:560px;max-height:82dvh;overflow:auto;background:#140d22;
  border:1px solid var(--stroke2);border-radius:24px 24px 0 0;
  padding:22px 20px calc(24px + var(--safe-b));box-shadow:0 -20px 60px rgba(0,0,0,.6);
  animation:sheetUp .42s var(--e)}
@keyframes sheetUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.sheet h4{font-family:var(--h);font-size:22px;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sheet .src{font-size:11.5px;color:var(--muted2);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.sheet p{font-size:15px;line-height:1.55;color:var(--muted);margin:14px 0 0}
.sheet a{color:var(--a4);font-size:13.5px;font-weight:600;display:inline-block;margin-top:14px}
.sheet .close{margin-top:18px}
.grab{width:42px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:0 auto 16px}
@media (min-width:600px){
  .modal{align-items:center}
  .sheet{border-radius:24px;max-height:76dvh;padding-bottom:24px}
  .grab{display:none}
}

/* ============ ШИРОКИЕ ЭКРАНЫ ============ */
@media (min-width:600px){ .themegrid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))} }
@media (min-width:760px){
  .wrap{padding:20px 20px 40px}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mode{padding:26px 20px}
  .mode::before{left:0;right:0;bottom:auto;width:auto;height:4px;background:linear-gradient(90deg,var(--c1),var(--c2))}
  .mode .arr{display:none}
  .mode b{font-size:21px}
  #s-play.on,#s-ready.on{min-height:calc(100vh - 60px);min-height:calc(100dvh - 60px)}
  #stage{max-height:58vh}
}
@media (min-width:980px){
  .wrap{max-width:960px}
  .modes{grid-template-columns:repeat(3,1fr)}
}
/* на телефоне играем только свайпами */
@media (max-width:759px){
  .desk{display:none!important}
  #s-play .actions{display:none!important}
}
@media (min-width:760px){ .mob{display:none!important} }
/* телефон лёжа */
@media (max-height:520px) and (orientation:landscape){
  .wrap{padding:8px 12px calc(10px + var(--safe-b))}
  #s-play.on,#s-ready.on{min-height:calc(100vh - 18px - var(--safe-b));min-height:calc(100dvh - 18px - var(--safe-b))}
  #stage{max-height:none}
  .playhead{margin-bottom:8px}
  .timerbox{width:46px;height:46px}
  .wordcard{padding:16px}
  .wordcard .w{font-size:clamp(26px,5.4vw,42px)}
  .actions .btn{padding:15px 10px}
  .ring{width:64px;height:64px;font-size:24px;margin-bottom:12px}
  .hint{margin-top:6px}
}
</style>
</head>
<body>
<div class="wrap">

<!-- ГЛАВНАЯ -->
<section id="s-home" class="screen on">
  <div class="hero">
    <h1 class="logo">ALIAS</h1>
    <div class="byline">имени Луговской Дарьи Шуровны</div>
  </div>
  <div class="modes">
    <button class="mode" data-mode="classic" style="--c1:#a855f7;--c2:#ec4899"><b>Классика</b><span class="arr">›</span></button>
    <button class="mode" data-mode="topics"  style="--c1:#38bdf8;--c2:#a855f7"><b>По темам</b><span class="arr">›</span></button>
    <button class="mode" data-mode="bvg"     style="--c1:#38bdf8;--c2:#f472b6"><b>Boys vs Girls</b><span class="arr">›</span></button>
    <!-- режим временно выключен: убрать hidden, чтобы вернуть -->
    <button class="mode" data-mode="draw" hidden style="--c1:#f59e0b;--c2:#ec4899"><b>Рисунок</b><span class="arr">›</span></button>
    <button class="mode" data-mode="whose"   style="--c1:#34d399;--c2:#38bdf8"><b>Чья фраза</b><span class="arr">›</span></button>
  </div>
</section>

<!-- НАСТРОЙКИ -->
<section id="s-setup" class="screen">
  <div class="top"><button class="iconbtn" data-go="home">←</button><h2 id="setup-title"></h2></div>
  <div id="setup-warn"></div>

  <div class="card"><h3>Команды</h3>
    <div id="teams"></div>
    <div class="row">
      <button class="btn ghost" id="reroll-teams">Перемешать</button>
      <button class="btn ghost" id="addteam">+ команда</button>
    </div>
  </div>

  <div class="card" id="box-levels"><h3>Сложность</h3><div class="pills" id="levels"></div></div>

  <div class="card" id="box-themes"><h3>Темы</h3><div class="themegrid" id="themes"></div></div>

  <div class="card"><h3>Правила</h3>
    <div class="field"><label>Время на ход <b><span id="v-time"></span> с</b></label>
      <input type="range" id="r-time" min="20" max="180" step="5"></div>
    <div class="field"><label>Играем до <b><span id="v-goal"></span></b></label>
      <input type="range" id="r-goal" min="10" max="100" step="5"></div>
    <div class="field" id="f-count"><label>Карточек за ход <b><span id="v-count"></span></b></label>
      <input type="range" id="r-count" min="1" max="15" step="1"></div>
    <div class="switch" id="sw-penalty"><span>Штраф за пропуск</span><div class="tog"></div></div>
    <div class="switch" id="sw-last"><span>Доигрываем последнее</span><div class="tog"></div></div>
    <div class="switch" id="sw-hints"><span>Подсказки</span><div class="tog"></div></div>
    <div class="switch" id="sw-opts"><span>Варианты ответа</span><div class="tog"></div></div>
    <div class="switch" id="sw-swap"><span>Поменять наборы</span><div class="tog"></div></div>
    <div class="switch" id="sw-sound"><span>Звук</span><div class="tog"></div></div>
    <div class="switch" id="sw-vibro"><span>Вибрация</span><div class="tog"></div></div>
  </div>

  <button class="btn primary big" id="start">Поехали</button>
  <div class="sp"></div>
</section>

<!-- ГОТОВНОСТЬ -->
<section id="s-ready" class="screen">
  <div class="top"><button class="iconbtn" data-go="home">✕</button><h2 id="ready-mode"></h2>
    <button class="iconbtn" id="btn-board">Счёт</button></div>
  <div class="ready">
    <div class="ring" id="ready-ring">1</div>
    <div class="kicker">ход</div>
    <div class="who" id="ready-team"></div>
    <div id="ready-chip"></div>
  </div>
  <button class="btn primary big" id="btn-start-round">Старт</button>
  <div class="hint desk">пробел</div>
</section>

<!-- ИГРА -->
<section id="s-play" class="screen">
  <div class="playhead">
    <button class="quit" id="btn-quit" title="Закончить ход">✕</button>
    <div class="timerbox">
      <svg width="56" height="56" viewBox="0 0 56 56">
        <circle cx="28" cy="28" r="24" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="5"/>
        <circle id="tarc" cx="28" cy="28" r="24" fill="none" stroke="url(#tg)" stroke-width="5" stroke-linecap="round"/>
        <defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f59e0b"/><stop offset="55%" stop-color="#ec4899"/><stop offset="100%" stop-color="#a855f7"/>
        </linearGradient></defs>
      </svg>
      <div class="t" id="tnum"></div>
    </div>
    <div class="meta"><div class="tn" id="play-team"></div><div class="sc" id="play-sub"></div></div>
    <div class="scorenow" id="play-score">0</div>
  </div>
  <div id="stage"></div>
  <div id="extra"></div>
  <div class="actions">
    <button class="btn bad" id="btn-skip">Мимо</button>
    <button class="btn ok" id="btn-hit">Есть!</button>
  </div>
  <div class="hint mob"><span class="r">← мимо</span> &nbsp;·&nbsp; смахни карточку &nbsp;·&nbsp; <span class="g">есть →</span></div>
  <div class="hint desk"><span class="kbd">←</span> мимо &nbsp;<span class="kbd">→</span> есть</div>
</section>

<!-- ИТОГ ХОДА -->
<section id="s-review" class="screen">
  <div class="top"><button class="iconbtn" data-go="home">✕</button><h2>Итог хода</h2></div>
  <div class="tally"><span class="n" id="rv-num">0</span><span class="l" id="rv-lbl"></span></div>
  <div class="rlist" id="rv-list"></div>
  <button class="btn primary big" id="rv-next">Дальше</button>
  <div class="sp"></div>
</section>

<!-- ТАБЛО -->
<section id="s-board" class="screen">
  <div class="top"><button class="iconbtn" data-go="home">✕</button><h2>Счёт</h2></div>
  <div id="win-block"></div>
  <div class="board" id="board"></div>
  <div class="sp"></div>
  <div class="row">
    <button class="btn" id="bd-again">Заново</button>
    <button class="btn primary" id="bd-continue">Продолжить</button>
  </div>
  <div class="sp"></div>
  <button class="btn ghost" id="bd-reset">Выйти</button>
  <div class="sp"></div>
</section>

</div>

<script src="data/words-general.js"></script>
<script src="data/words-humanities.js"></script>
<script src="data/words-science.js"></script>
<script src="data/words-culture.js"></script>
<script src="data/words-bvg.js"></script>
<script src="data/words-people.js"></script>
<script src="data/words-more-1.js"></script>
<script src="data/words-more-2.js"></script>
<script src="data/words-more-3.js"></script>
<script src="data/words-more-4.js"></script>
<script src="data/phrases.js"></script>
<script src="data/photos.js"></script>
<script src="app.js"></script>
</body>
</html>
